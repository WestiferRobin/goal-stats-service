name: Service CI

on:
  push:
    branches: [master, member/wes]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal-stats-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare repository Python environment
        run: python scripts/development/python_environment.py bootstrap
      - name: Test service
        run: make test
