# Disposable providers owned exclusively by scripts/testing/test.sh.
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    labels:
      org.goalstats.test-session: ${TEST_SESSION:?Owned test session required}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Owned test user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Owned test password required}
      POSTGRES_DB: goalstats_test_runtime
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d goalstats_test_runtime"]
      interval: 1s
      timeout: 3s
      retries: 40
    tmpfs: ["/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    labels:
      org.goalstats.test-session: ${TEST_SESSION:?Owned test session required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Owned test password required}
    command: ["/bin/sh", "-ec", 'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"']
    ports:
      - target: 6379
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 1s
      timeout: 3s
      retries: 40
networks:
  default:
    labels:
      org.goalstats.test-session: ${TEST_SESSION:?Owned test session required}
