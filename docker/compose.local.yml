# The public local stack is owned by scripts/local.sh through one fixed project.
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: goalstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
      POSTGRES_DB: goal_stats_service_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalstats -d goal_stats_service_local"]
      interval: 1s
      timeout: 3s
      retries: 40
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 40
  app:
    image: goal-stats-service:runtime
    build:
      context: ..
      target: runtime
    init: true
    stop_grace_period: 15s
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://goalstats:${POSTGRES_PASSWORD}@postgres:5432/goal_stats_service_local
      REDIS_URL: redis://redis:6379/0
      CACHE_KEY_PREFIX: goal-stats-service:local:v1
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
    ports: ["127.0.0.1:${APP_PORT:-5100}:8000"]
    command: ["flask", "--app", "main:create_app()", "run", "--host=0.0.0.0", "--port=8000", "--reload", "--no-debugger"]
    volumes:
      - ../src:/app/src:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
