[pytest]
pythonpath = src scripts/development scripts/database scripts/testing
testpaths = tests/unit tests/integration
addopts = --import-mode=importlib --strict-markers --strict-config
markers =
    smoke: real HTTP against an owned built Gunicorn stack
    redis: requires an explicitly provisioned disposable Redis instance
    postgres: requires an explicitly provisioned disposable PostgreSQL database
filterwarnings =
    error
